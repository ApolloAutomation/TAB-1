substitutions:
  brightness_icon:           "\U0000e900"
  saturation_icon:           "\U0000e901"
  exit_icon:                 "\U0000e902"

globals:
  - id: last_touch_millis
    type: int
    restore_value: no
    initial_value: '0'
  - id: display_timeout
    type: int
    restore_value: true
    initial_value: "1"
  - id: ui_visible
    type: bool
    initial_value: 'true'
  - id: ui_hide_timer
    type: int
    initial_value: '0'
  - id: photo_hide_timer
    type: int
    initial_value: '0'
  - id: slideshow_running
    type: bool
    initial_value: 'false'
  - id: current_lvgl_page
    type: std::string
    initial_value: '"main"'

script:
  # Show UI elements on touch
  - id: toggle_ui
    then:
      - lvgl.widget.show: header
      - lvgl.widget.show: navigation_footer
      - delay: 3s
      - lvgl.widget.hide: header
      - lvgl.widget.hide: navigation_footer

  # Reset Picture UI timer (called on any interaction)
  - id: reset_ui_timer
    mode: restart
    then:
      - lambda: |-
          id(ui_hide_timer) = 3;  // 3 seconds until hide
          // Show UI if hidden
          if (!id(ui_visible)) {
            lv_obj_clear_flag(id(header), LV_OBJ_FLAG_HIDDEN);
            id(ui_visible) = true;
          }

  # Hide UI elements
  - id: hide_ui
    mode: single
    then:
      - lambda: |-
          lv_obj_add_flag(id(header), LV_OBJ_FLAG_HIDDEN);
          id(ui_visible) = false;

