wifi:
  ap:
    ssid: "Apollo TAB1 Hotspot"

api:
  reboot_timeout: 0s
  homeassistant_services: true
  encryption:
  on_client_connected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.show: lbl_hastatus
          - lvgl.widget.hide: boot_screen
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.hide: lbl_hastatus
  services:
    - service: show_image
      variables:
        index: int
      then:
        - lambda: id(picture_viewer_id)->show_image(index);
    
    - service: start_slideshow
      then:
        - lambda: id(picture_viewer_id)->start_slideshow();
    
    - service: stop_slideshow
      then:
        - lambda: id(picture_viewer_id)->stop_slideshow();

ota:
  - platform: esphome

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG
  baud_rate: 115200
