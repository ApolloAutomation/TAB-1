webdav_server:
  id: webdav_sdcard
  storage_host_id: storage_host_id
  root_path: "/"
  url_prefix: "/"
  port: 81
  username: "admin"
  password: "123456"

http_file_server:
  storage_host_id: storage_host_id
  url_prefix: "/files"
  root_path: "/"
  auth_enabled: true
  username: "admin"
  password: "123456"
  enable_upload: true
  enable_download: true
  enable_deletion: true

switch:
  - platform: gpio
    pin: GPIO53 #PA-CTRL
    name: "Speaker enable"
    restore_mode: ALWAYS_OFF
    id: speaker_enable_switch
    inverted: False
  - platform: template
    name: "Ring Timer"
    id: timer_ringing
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
        # Stop playing the alarm
        - media_player.stop:
            announcement: true
    on_turn_on:
        - while:
            condition:
                switch.is_on: timer_ringing
            then:
                # Play the alarm sound as an announcement
                - media_player.speaker.play_on_device_media_file:
                    media_file: alarm_sound
                    announcement: true
                # Wait until the alarm sound starts playing
                - wait_until:
                    media_player.is_announcing:
                # Wait until the alarm sound stops playing
                - wait_until:
                    not:
                      media_player.is_announcing:


audio_dac:
  - platform: es8311
    id: es8311_codec
    i2c_id: i2c_bus_a
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 44100
    use_mclk: True
    use_microphone: True
    microphone_type: analog
    mic_gain: 24DB

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12
    i2s_mclk_pin: GPIO13

microphone:
  - platform: i2s_audio
    id: external_mic
    i2s_audio_id: i2s_output
    i2s_mode: primary
    adc_type: external
    i2s_din_pin: GPIO11
    sample_rate: 16000
    bits_per_channel: 16bit
    channel: stereo

speaker:
  - platform: i2s_audio
    i2s_audio_id: i2s_output
    id: speaker_id
    i2s_dout_pin: GPIO09
    dac_type: external
    sample_rate: 44100
    bits_per_sample: 16bit
    channel: left
    audio_dac: es8311_codec
    buffer_duration: 1000ms
    i2s_mode: primary
  - platform: mixer
    id: mixer_speaker_id
    output_speaker: speaker_id
    num_channels: 1
    task_stack_in_psram: True
    source_speakers:
      - id: announcement_spk_mixer_input
      - id: media_spk_mixer_input
  - platform: resampler
    id: media_spk_resampling_input
    output_speaker: media_spk_mixer_input
  - platform: resampler
    id: announcement_spk_resampling_input
    output_speaker: announcement_spk_mixer_input

media_player:
  - platform: speaker
    name: "Speaker Media Player"
    id: speaker_media_player_id
    task_stack_in_psram: True
    buffer_size: 1000000
    codec_support_enabled: True
    volume_initial: 70%
    volume_max: 70%
    announcement_pipeline:
        speaker: announcement_spk_resampling_input
        sample_rate: 44100
        num_channels: 1
    files:
      - id: alarm_sound
        file: 'sounds/testsound.flac'
      - id: wake_sound_file
        file: 'sounds/timer_finished.flac'
    on_announcement:
      - if:
          condition:
            - microphone.is_capturing:
                id: external_mic
          then:
            - micro_wake_word.stop: {}
    on_idle:
      - if:
          condition:
            - not:
                voice_assistant.is_running: {}
          then:
            - micro_wake_word.start: {}

micro_wake_word:
  id: mww
  microphone: external_mic
  models:
    - okay_nabu
    - hey_jarvis
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: external_mic
  media_player: speaker_media_player_id
  micro_wake_word: mww
  on_end:
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        - and:
            - not:
                media_player.is_announcing:
            - not:
                media_player.is_playing:
    - micro_wake_word.start:
  on_client_connected:
    - micro_wake_word.start:
  on_client_disconnected:
    - micro_wake_word.stop:

tab5_camera:
  id: picam
  name: "PiCam"
  i2c_id: i2c_bus_a
  external_clock_pin: GPIO36
  resolution: SVGA
  frequency: 24000000
  framerate: 50             
  jpeg_quality: 10      

lvgl_camera_display:
  id: camera_display
  camera_id: picam
  canvas_id: camera_canvas
  update_interval: 40ms

binary_sensor:
  # Up Arrow
  - platform: template
    name: "Remote Up"
    id: remote_up

  # Down Arrow
  - platform: template
    name: "Remote Down"
    id: remote_down

  # Left Arrow
  - platform: template
    name: "Remote Left"
    id: remote_left

  # Right Arrow
  - platform: template
    name: "Remote Right"
    id: remote_right

  # Select/OK button
  - platform: template
    name: "Remote Select"
    id: remote_select

  # Back button
