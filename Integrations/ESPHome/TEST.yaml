  mode: hex
  speed: "200MHz"

preferences:
  flash_write_interval: never


time:
  - platform: host
    id: host_time
    timezone: Europe/Berlin
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    update_interval: 3h
  - platform: homeassistant
    id: timestamp
    on_time:
      - seconds: '*'
        then:
          - lvgl.label.update:
              id: time_label
              text: 
                time_format: "%T"

button:
  - platform: template
    name: "Play Test Sound 0"
    on_press:
      - media_player.speaker.play_on_device_media_file:
          id: speaker_media_player_id
          media_file: wake_sound_file

number:
  - platform: template
    id: display_timeout_number
    name: LVGL screen timeout
    optimistic: true
    unit_of_measurement: "m"
    initial_value: 10
    restore_value: true
    min_value: -1
    max_value: 720
    step: 1
    mode: box

