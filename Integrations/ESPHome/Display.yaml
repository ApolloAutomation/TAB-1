# ============================================================================
#  Display.yaml — DSI panel, GT911 touch, and the LVGL dashboard
#  Pulled in as a package by TAB-1.yaml.
#
#  ┌──────────────────────────────────────────────────────────────────────┐
#  │  HOW TO MAKE THIS YOURS                                               │
#  │  Search for  "<-- EDIT"  below and replace the placeholder entity_id  │
#  │  values (light.living_room, sensor.living_room_temperature, …) with   │
#  │  your real Home Assistant entities. That's it.                        │
#  └──────────────────────────────────────────────────────────────────────┘
# ============================================================================

# --- Colour palette ---------------------------------------------------------
color:
  - id: bg_dark
    hex: "0F1420"
  - id: card_bg
    hex: "1B2233"
  - id: accent
    hex: "3FA7F3"
  - id: on_color
    hex: "F4A900"
  - id: text_primary
    hex: "F2F4F8"
  - id: text_muted
    hex: "8A93A6"

# --- Display power/backlight chip on the shared I²C bus (address 0x45) -------
# on_boot (in TAB-1.yaml) writes register 0x96 to turn the backlight on; the
# "Screen Brightness" slider below writes the same register to dim it.
i2c_device:
  - id: display_i2c
    address: 0x45
    i2c_id: i2c_bus_a

# --- Capacitive touch panel -------------------------------------------------
touchscreen:
  - platform: gt911
    id: touchscreen_id
    i2c_id: i2c_bus_a
    update_interval: 50ms
    # Orientation is handled by `lvgl: rotation` below (LVGL rotates touch too).
    # If touch is mirrored/swapped on your unit, correct it here, e.g.:
    #   transform: { swap_xy: true, mirror_x: true, mirror_y: false }

# --- 10.1" MIPI-DSI panel (JD9365, 800×1280 native → 1280×800 landscape) ----
# Rotation must live in the LVGL block, not here (LVGL is incompatible with
# display-level rotation). On the ESP32-P4 it's PPA hardware-accelerated.
display:
  - platform: mipi_dsi
    id: dsi_display
    model: WAVESHARE-P4-NANO-10.1
    auto_clear_enabled: false
    update_interval: never     # LVGL drives all drawing

# --- Clock (from Home Assistant) --------------------------------------------
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - then:
          - lvgl.label.update:
              id: lbl_time
              text:
                time_format: "%H:%M"
                time: ha_time
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - lvgl.label.update:
              id: lbl_time
              text:
                time_format: "%H:%M"
                time: ha_time

# ============================================================================
#  Home Assistant data feeds
#  These pull live values FROM Home Assistant and push them onto the screen.
# ============================================================================
binary_sensor:
  # Reflects the ESPHome↔Home Assistant connection in the header.
  - platform: status
    id: sys_status
    on_state:
      - lvgl.label.update:
          id: lbl_ha_status
          text: !lambda 'return std::string(x ? "Connected" : "Offline");'

  # Light on/off states → keep the toggle buttons in sync with reality.
  - platform: homeassistant
    id: ha_light_1
    entity_id: light.living_room          # <-- EDIT
    trigger_on_initial_state: true
    on_state:
      - lvgl.widget.update:
          id: btn_light_1
          state:
            checked: !lambda 'return x;'
  - platform: homeassistant
    id: ha_light_2
    entity_id: light.kitchen              # <-- EDIT
    trigger_on_initial_state: true
    on_state:
      - lvgl.widget.update:
          id: btn_light_2
          state:
            checked: !lambda 'return x;'

sensor:
  - platform: homeassistant
    id: ha_sensor_temp
    entity_id: sensor.living_room_temperature   # <-- EDIT
    on_value:
      - lvgl.label.update:
          id: lbl_val_temp
          text:
            format: "%.1f°"
            args: ['x']
  - platform: homeassistant
    id: ha_sensor_humidity
    entity_id: sensor.living_room_humidity      # <-- EDIT
    on_value:
      - lvgl.label.update:
          id: lbl_val_humidity
          text:
            format: "%.0f%%"
            args: ['x']
  - platform: homeassistant
    id: ha_sensor_extra
    entity_id: sensor.living_room_co2           # <-- EDIT
    on_value:
      - lvgl.label.update:
          id: lbl_val_extra
          text:
            format: "%.0f"
            args: ['x']

# ============================================================================
#  The dashboard
# ============================================================================
lvgl:
  displays:
    - dsi_display
  touchscreens:
    - touchscreen_id
  rotation: 270°          # native panel is portrait; present it as landscape
  default_font: montserrat_20
  bg_color: bg_dark

  theme:
    label:
      text_color: text_primary

  style_definitions:
    - id: card
      bg_color: card_bg
      bg_opa: COVER
      radius: 16
      border_width: 0
      pad_all: 18
      text_color: text_primary
    - id: card_title
      text_color: text_muted
      text_font: montserrat_20
    - id: value_big
      text_color: text_primary
      text_font: montserrat_48
    - id: light_btn
      bg_color: card_bg
      bg_opa: COVER
      radius: 16
      border_width: 0
      text_color: text_primary
      text_font: montserrat_28

  pages:
    - id: main_page
      bg_color: bg_dark
      scrollbar_mode: "OFF"
      pad_all: 0
      widgets:
        # ---- Header bar ----------------------------------------------------
        - obj:
            align: TOP_MID
            y: 0
            width: 1280
            height: 72
            bg_color: bg_dark
            bg_opa: COVER
            border_width: 0
            radius: 0
            pad_all: 0
            widgets:
              - label:
                  id: lbl_time
                  text: "--:--"
                  text_font: montserrat_28
                  align: LEFT_MID
                  x: 24
              - label:
                  text: "Home"
                  text_font: montserrat_28
                  align: CENTER
              - label:
                  id: lbl_ha_status
                  text: "Offline"
                  text_color: text_muted
                  align: RIGHT_MID
                  x: -24

        # ---- Row 1: light toggle buttons -----------------------------------
        - obj:
            align: TOP_MID
            y: 92
            width: 1232
            height: 168
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            layout:
              type: flex
              flex_flow: ROW
              pad_column: 24
              flex_align_main: CENTER
              flex_align_cross: CENTER
            widgets:
              - button:
                  id: btn_light_1
                  flex_grow: 1
                  height: 100%
                  checkable: true
                  styles: light_btn
                  checked:
                    bg_color: on_color
                    text_color: bg_dark
                  widgets:
                    - label:
                        text: "Living Room"
                        align: CENTER
                  on_click:
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: light.living_room     # <-- EDIT
              - button:
                  id: btn_light_2
                  flex_grow: 1
                  height: 100%
                  checkable: true
                  styles: light_btn
                  checked:
                    bg_color: on_color
                    text_color: bg_dark
                  widgets:
                    - label:
                        text: "Kitchen"
                        align: CENTER
                  on_click:
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: light.kitchen         # <-- EDIT

        # ---- Row 2: sliders ------------------------------------------------
        - obj:
            align: TOP_MID
            y: 280
            width: 1232
            height: 150
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            layout:
              type: flex
              flex_flow: ROW
              pad_column: 24
              flex_align_main: CENTER
              flex_align_cross: CENTER
            widgets:
              # HA light brightness — sends light.turn_on with brightness_pct
              - obj:
                  flex_grow: 1
                  height: 100%
                  styles: card
                  widgets:
                    - label:
                        text: "Living Room Brightness"
                        styles: card_title
                        align: TOP_LEFT
                    - slider:
                        id: sld_light_1
                        align: BOTTOM_MID
                        width: 100%
                        min_value: 0
                        max_value: 100
                        value: 50
                        on_release:
                          - homeassistant.action:
                              action: light.turn_on
                              data:
                                entity_id: light.living_room        # <-- EDIT
                                brightness_pct: !lambda 'return (int) x;'
              # Local screen backlight — writes I²C register 0x96 (works offline)
              - obj:
                  flex_grow: 1
                  height: 100%
                  styles: card
                  widgets:
                    - label:
                        text: "Screen Brightness"
                        styles: card_title
                        align: TOP_LEFT
                    - slider:
                        id: sld_backlight
                        align: BOTTOM_MID
                        width: 100%
                        min_value: 10
                        max_value: 100
                        value: 100
                        on_value:
                          - lambda: |-
                              uint8_t duty = (uint8_t) roundf(x * 2.55f);
                              if (duty < 12) duty = 12;
                              id(display_i2c).write_byte(0x96, duty);

        # ---- Row 3: sensor readouts ----------------------------------------
        - obj:
            align: TOP_MID
            y: 450
            width: 1232
            height: 200
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            layout:
              type: flex
              flex_flow: ROW
              pad_column: 24
              flex_align_main: CENTER
              flex_align_cross: CENTER
            widgets:
              - obj:
                  flex_grow: 1
                  height: 100%
                  styles: card
                  widgets:
                    - label:
                        id: lbl_val_temp
                        text: "--"
                        styles: value_big
                        align: CENTER
                        y: -14
                    - label:
                        text: "Temperature"
                        styles: card_title
                        align: BOTTOM_MID
              - obj:
                  flex_grow: 1
                  height: 100%
                  styles: card
                  widgets:
                    - label:
                        id: lbl_val_humidity
                        text: "--"
                        styles: value_big
                        align: CENTER
                        y: -14
                    - label:
                        text: "Humidity"
                        styles: card_title
                        align: BOTTOM_MID
              - obj:
                  flex_grow: 1
                  height: 100%
                  styles: card
                  widgets:
                    - label:
                        id: lbl_val_extra
                        text: "--"
                        styles: value_big
                        align: CENTER
                        y: -14
                    - label:
                        text: "CO2"
                        styles: card_title
                        align: BOTTOM_MID
