touchscreen:
  - platform: gt911
    id: touchscreen_id
    update_interval: 100ms
    transform:
      swap_xy: True
      mirror_y: False
      mirror_x: True
    on_touch:
    - lambda: |-
          // Any touch shows UI and resets timer
          id(toggle_ui).execute();
    on_release:
      - if:
          condition: lvgl.is_paused        
          then:
            - logger.log: "LVGL resuming"
            - lvgl.resume:
            - lvgl.widget.redraw: 
            - lvgl.page.show: main_page      
            - light.turn_on:
                id: backlight
                brightness: 80%
                transition_length: 2s

i2c_device:
  - id: display_i2c
    address: 0x45
    i2c_id: i2c_bus_a

light:
  - platform: mipi_dsi
    id: backlight
    pwm_register: 0x96
    restore_mode: ALWAYS_ON

display:
  - platform: mipi_dsi
    setup_priority: 790.0
    model: WAVESHARE-P4-NANO-10.1
    id: dsi_display
    rotation: 270°
    show_test_card: False
    update_interval: 13ms


sd_mmc_card:
  id: sd_card
  clk_pin: GPIO43
  cmd_pin: GPIO44
  data0_pin: GPIO39
  data1_pin: GPIO40
  data2_pin: GPIO41
  data3_pin: GPIO42
  mode_1bit: false
  slot: 0

storage_host:
  id: storage_host_id
  mounts:
    - path: /sdcard
      platform: sd_mmc
      id: sd_storage
    - path: /usb
      platform: usb_msc
      id: usb_storage
    - path: /usb2
      platform: usb_msc
      id: usb_storage_2
  file_managers:
    - id: photo_monitor
      watch_directory: /usb/jpg
      patterns: ["*.jpg", "*.jpeg"]
      on_directory_changed:
        - lambda: |-
            // Log changes for debugging
            ESP_LOGI("FileManager", "Directory changed: %zu files total", x.files.size());
            if (!x.added.empty()) {
              ESP_LOGI("FileManager", "  Added: %zu files", x.added.size());
            }
            if (!x.deleted.empty()) {
              ESP_LOGI("FileManager", "  Deleted: %zu files", x.deleted.size());
            }

            // Send updated complete file list to picture_viewer
            id(picture_viewer_id)->update_directory_files(x.path, x.files);

    - id: photo_monitor_2
      watch_directory: /usb2/jpg
      patterns: ["*.jpg", "*.jpeg"]
      on_directory_changed:
        - lambda: |-
            // Log changes for debugging
            ESP_LOGI("FileManager", "Directory changed: %zu files total", x.files.size());
            if (!x.added.empty()) {
              ESP_LOGI("FileManager", "  Added: %zu files", x.added.size());
            }
            if (!x.deleted.empty()) {
              ESP_LOGI("FileManager", "  Deleted: %zu files", x.deleted.size());
            }

            // Send updated complete file list to picture_viewer
            id(picture_viewer_id)->update_directory_files(x.path, x.files);
      

picture_viewer:
  id: picture_viewer_id
  file_manager_id: photo_monitor
  canvas_id: photo_canvas
  display_id: dsi_display
  thumbnail_container_id: thumb_list
  thumbnail_slide_enabled: true
  thumbnail_style_id: thumbnail_style
  thumbnail_active_style_id: thumbnail_active_style
  thumbnail_container_style_id: thumbnail_container_style
  
  
  # Directories to monitor
  directories:
    - path: /usb/jpg
      jpeg_rgb_order: RGB
      jpeg_color_space: BT601
      jpeg_output_format: RGB565
    - path: /usb2/jpg
      jpeg_rgb_order: RGB
      jpeg_color_space: BT601
      jpeg_output_format: RGB565
  
  # Slideshow settings
  slideshow_interval: 5s
  fit_mode: SCALE_TO_FIT
  
  # Thumbnail settings
  enable_thumbnails: true
  thumbnail_width: 224
  thumbnail_height: 140
  thumbnail_max_count: 20
  thumbnail_decode_work_buffer_size: 2097152  # 2MB work buffer
  thumbnail_lazy_load: true
  thumbnail_preload_count: 10
  
  # Layout: VERTICAL (for side strip) | HORIZONTAL (for bottom strip) | GRID (for gallery)
  thumbnail_layout: VERTICAL
  thumbnail_spacing: 0
  thumbnail_grid_columns: 3  # Only used for GRID layout
  
  # NEW: Overlay icon settings
  overlay_icon_size: 128        # Size of play/pause icon (32-256 pixels)
  overlay_icon_color: 0xFFFFFF  # White color (RGB hex)
  overlay_duration: 1500 

image:
  - file: 'images/Apollo.png'
    byte_order: little_endian
    id: boot_logo
    resize: 300x300
    type: RGB565
    transparency: alpha_channel

lvgl:
  displays:
    - dsi_display
  
  touchscreens:
    - touchscreen_id
  

  # Theme configuration
  theme:
    obj:
      text_font: nunito_24
      bg_color: color_black
      text_color: color_white

  style_definitions:
    - id: main_page_style
      width: 100%
      height: 85%
      align: CENTER
    - id: header_footer
      radius: 0
      pad_all: 0
      pad_row: 0
      pad_column: 0
      border_width: 0
      text_color: color_white
      width: 100%
      height: 7.5%
      bg_color: color_black
    - id: thumb_active_style
      border_width: 0
      bg_opa: 100%
    - id: floating_controls_style
      bg_color: color_black
      bg_opa: 100%
      border_width: 0
    - id: thumb_button_style
      bg_color: color_black
      bg_opa: 100%
      border_width: 0
      pad_row: 0
      text_font: nunito_24
    - id: no_scrollbar_style
      scrollbar_mode: "OFF"
    - id: thumbnail_style
      scrollbar_mode: "OFF"
      bg_opa: TRANSP
      bg_color: color_black
      border_width: 0
      radius: 0
      pad_all: 0
    - id: thumbnail_active_style
      scrollbar_mode: "OFF"
      bg_opa: TRANSP
      bg_color: color_black
      border_width: 0
      radius: 0
      pad_all: 0
    - id: thumbnail_container_style
      scrollbar_mode: "OFF"
      bg_opa: TRANSP
      bg_color: color_black
      border_width: 0
      radius: 0
      pad_all: 0

  top_layer:
    widgets:
      - obj:
          id: header
          align: TOP_MID
          styles: header_footer
          widgets:
            - label:
                text_font: nunito_24 # set all your labels to use your custom defined font
                id: time_label
                text: "Time"
                align: top_left
                text_align: left
            - label:
                text_font: nunito_24
                text: "Tab10-Demo"
                align: CENTER
                text_align: CENTER
            - label:
                text: "\U000F0119"
                text_font: mdi24
                id: lbl_hastatus
                hidden: true
                align: top_right
                text_align: right
      - buttonmatrix:
          text_font: mdi24
          align: bottom_mid
          styles: header_footer
          pad_all: 0
          outline_width: 0
          id: navigation_footer
          items:
            styles: header_footer
          rows:
            - buttons:
                - id: page_prev
                  text: "\U000F0BB2"
                  on_press:
                    then:
                    - lvgl.page.previous:
                        animation: NONE
                - id: page_home
                  text: "\U000F02DC"
                  on_press:
                    then:
                      lvgl.page.show: main_page
                - id: sleep_button
                  text: "\U000F0425"
                  on_release:
                    then:
                      - logger.log: "LVGL is idle"
                      - light.turn_off: backlight
                      - lvgl.pause:
                          show_snow: true
                - id: page_next
                  text: "\U000F0BB0"
                  on_press:
                    then:
                      - lvgl.page.next:
                          animation: NONE
      - obj:
          id: boot_screen
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_color: color_black
          radius: 0
          pad_all: 0
          border_width: 0
          widgets:
            - image:
                align: CENTER
                src: boot_logo
                y: -40
            - spinner:
                align: CENTER
                y: 95
                height: 50
                width: 50
                spin_time: 1s
                arc_length: 60deg
                arc_width: 8
                indicator:
                  arc_color: color_steel_blue
                  arc_width: 8
          on_press:
            - lvgl.widget.hide: boot_screen

  # Pages
  pages:
    - id: main_page
      on_load:
        then:
          - globals.set:
              id: current_lvgl_page
              value: '"main"'
      scrollbar_mode: "OFF"
      bg_color: color_black
    # ==================== Settings Page ====================
    - id: settings_page
      on_load:
        then:
          - globals.set:
              id: current_lvgl_page
              value: '"settings"'
      scrollbar_mode: "OFF"
      widgets:
        # Header
        - obj:
            id: settings_header
            width: 100%
            height: 60
            align: TOP_MID
            bg_color: color_black
            text_color: color_white
            border_width: 0
            pad_all: 10
            widgets:
              - label:
                  text: "Settings"
                  align: CENTER
        
        # Main content container
        - obj:
            width: 100%
            height: SIZE_CONTENT
            align: CENTER
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: START
              flex_align_cross: CENTER
              pad_row: 20
            widgets:
              # backlight:
              - obj:
                  id: backlight_bg
                  x: 20
                  y: 140
                  width: 750
                  height: 200
                  align: TOP_LEFT
                  pad_all: 0
                  border_width: 0
                  widgets:
      
                    - label:
                        id: display_backlight_label
                        x: 20
                        align: LEFT_MID
                        text_font: nunito_24
                        text: "Backlight"
      
                    - slider:
                        id: display_backlight_brightness_slider
                        x: -80
                        radius: 10
                        align: RIGHT_MID
                        width: 520
                        height: 120
                        min_value: 20
                        max_value: 100
                        value: 100
                        indicator:
                          radius: 20
                        on_release:
                          then:
                            - light.turn_on:
                                id: backlight
                                brightness: !lambda return int(x)/ 100.0;
              # sleep mode:
              - obj:
                  id: sleep_mode_bg
                  x: 20
                  y: 380
                  width: 750
                  height: 200
                  align: TOP_LEFT
                  pad_all: 0
                  border_width: 0
                  radius: 4
                  widgets:
                    - label:
                        id: display_timeout_label
                        x: 20
                        align: LEFT_MID
                        text_font: nunito_24
                        text: "Sleep mode"
      
                    - dropdown:
                        id: display_timeout_dropdown
                        x: 440
                        width: 400
                        align: LEFT_MID
                        selected_index: !lambda return id(display_timeout);
                        options:
                          - Never
                          - 1 minute
                          - 5 minutes
