    # ==================== Settings (swipe left to reach) ==================
    - id: settings_page
      bg_color: bg_dark
      scrollbar_mode: "OFF"
      on_swipe_right:
        - lvgl.page.show: { id: main_page, animation: MOVE_RIGHT, time: 250ms }
      widgets:
        - label: { text: "Settings", text_font: montserrat_28, align: TOP_MID, y: 24 }
        - obj:
            align: TOP_MID
            y: 90
            width: 900
            height: 150
            styles: card
            widgets:
              - label: { text: "Screen Brightness", styles: card_title, align: TOP_LEFT }
              - slider:
                  id: sld_backlight
                  align: BOTTOM_MID
                  width: 100%
                  height: 28
                  radius: 14
                  min_value: 10
                  max_value: 100
                  value: 100
                  indicator: { radius: 14 }
                  knob: { pad_all: 8, radius: 14 }
                  on_value:
                    - lambda: |-
                        uint8_t duty = (uint8_t) roundf(x * 2.55f);
                        if (duty < 12) duty = 12;
                        id(display_i2c).write_byte(0x96, duty);
        - obj:
            align: TOP_MID
            y: 260
            width: 900
            height: 92
            styles: card
            widgets:
              - label: { text: "Demo mode (show every tile type)", align: LEFT_MID }
              - switch:
                  id: demo_switch
                  align: RIGHT_MID
                  on_value:
                    - if:
                        condition: { lambda: 'return x;' }
                        then:
                          - script.execute: enter_demo
                        else:
                          - script.execute: exit_demo
        - button:
            align: TOP_MID
            y: 380
            width: 320
            height: 64
            bg_color: accent
            widgets:
              - label: { text: "+ Add tile", align: CENTER, text_color: bg_dark }
            on_click:
              - lambda: |-
                  for (int i = 0; i < 12; i++)
                    if (id(tile_sizes)[i] == 0) { id(tile_sizes)[i] = 1; break; }
              - script.execute: layout_tiles
        - label: { text: "Long-press a tile to change type/size. Swipe right to go back.", styles: card_title, align: BOTTOM_MID, y: -18 }
