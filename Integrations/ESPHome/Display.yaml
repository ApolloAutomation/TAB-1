  # ---- Demo mode ------------------------------------------------------------
  - id: enter_demo
    then:
      - lambda: |-
          id(demo_mode) = true;
          for (int i = 0; i < 12; i++) {
            if (tiles::demo_type(i) == tiles::TT_GRAPH)
              for (int j = 0; j < 24; j++)
                id(graph_hist)[i * 24 + j] = 50.0f + 40.0f * sinf(j * 0.7f);
          }
      - script.execute: render_tiles
      - script.execute: layout_tiles
  - id: exit_demo
    then:
      - lambda: 'id(demo_mode) = false;'
      - script.execute: render_tiles
      - script.execute: layout_tiles

  # ---- Save the on-screen keyboard's text into the active tile's entity box -
  - id: save_entity
    then:
      - lambda: |-
          text::Text *boxes[12] = { id(t0_entity), id(t1_entity), id(t2_entity), id(t3_entity), id(t4_entity), id(t5_entity), id(t6_entity), id(t7_entity), id(t8_entity), id(t9_entity), id(t10_entity), id(t11_entity) };
          std::string v = std::string(lv_textarea_get_text(id(entity_input)));
          boxes[id(active_tile)]->make_call().set_value(v).perform();
      - script.execute: subscribe_ha
      - script.execute: render_tiles

# ---- Feed the Graph tiles from their latest value, every 30s ---------------
interval:
  - interval: 30s
    then:
      - lambda: |-
          if (id(demo_mode)) return;
          for (int i = 0; i < 12; i++)
            if (tiles::shows_graph(id(tile_types)[i]) && !isnan(id(tile_reading)[i]))
              tiles::history_push(&id(graph_hist)[i * 24], 24, id(tile_reading)[i]);
      - script.execute: paint_graphs

  # ---- Re-fetch Camera tiles every 5s (Picture tiles load once) -------------
  - interval: 5s
    then:
      - lambda: |-
          if (id(demo_mode)) return;
          online_image::OnlineImage *ois_[12] = { id(oi0), id(oi1), id(oi2), id(oi3), id(oi4), id(oi5), id(oi6), id(oi7), id(oi8), id(oi9), id(oi10), id(oi11) };
          std::string ents_[12] = { id(t0_entity).state, id(t1_entity).state, id(t2_entity).state, id(t3_entity).state, id(t4_entity).state, id(t5_entity).state, id(t6_entity).state, id(t7_entity).state, id(t8_entity).state, id(t9_entity).state, id(t10_entity).state, id(t11_entity).state };
          for (int i = 0; i < 12; i++)
            if (tiles::is_camera(id(tile_types)[i]) && !ents_[i].empty())
              ois_[i]->update();
# ============================================================================
#  The dashboard UI
# ============================================================================
lvgl:
  displays:
    - dsi_display
  touchscreens:
    - touchscreen_id: touchscreen_id
      long_press_time: 900ms      # longer hold so swipes don't open the editor
  rotation: 270°
  default_font: montserrat_20
  bg_color: bg_dark

  theme:
    label:
      text_color: text_primary

  style_definitions:
    - id: card
      bg_color: card_bg
      bg_opa: COVER
      radius: 16
      border_width: 0
      pad_all: 18
      text_color: text_primary
    - id: card_title
      text_color: text_muted
      text_font: montserrat_20
    - id: tile_card
      bg_color: card_bg
      bg_opa: COVER
      radius: 16
      border_width: 0
      pad_all: 12
      text_color: text_primary
    - id: tile_name
      text_color: text_primary
      text_font: montserrat_20
    - id: tile_badge
      text_color: text_muted
      text_font: montserrat_16
    - id: tile_value
      text_color: accent
      text_font: montserrat_36
    - id: spark_bar
      bg_color: bg_dark
      bg_opa: COVER
      radius: 1
      border_width: 0
      pad_all: 0

  # ---- Long-press tile editor: type + size ---------------------------------
  top_layer:
    widgets:
      - obj:
          id: type_picker
          hidden: true
          align: CENTER
          width: 680
          height: 620
          bg_color: card_bg
          bg_opa: COVER
          radius: 18
          border_width: 0
          widgets:
            - label: { text: "Edit tile", styles: card_title, align: TOP_MID, y: 14 }
            - button:
                align: TOP_MID
                y: 44
                width: 360
                height: 50
                widgets:
                  - label: { text: "Set entity ID", align: CENTER }
                on_click:
                  - lambda: |-
                      text::Text *boxes[12] = { id(t0_entity), id(t1_entity), id(t2_entity), id(t3_entity), id(t4_entity), id(t5_entity), id(t6_entity), id(t7_entity), id(t8_entity), id(t9_entity), id(t10_entity), id(t11_entity) };
                      lv_textarea_set_text(id(entity_input), boxes[id(active_tile)]->state.c_str());
                  - lvgl.widget.show: entity_editor
            - label: { text: "Type", styles: card_title, align: TOP_LEFT, x: 78, y: 112 }
            - label: { text: "Size", styles: card_title, align: TOP_RIGHT, x: -86, y: 112 }
            - roller:
                id: type_roller
                align: CENTER
                x: -160
                y: 16
                width: 280
                options: ['Value', 'Switch', 'Light', 'Button', 'Scene', 'Cover', 'Climate', 'Lock', 'Fan', 'Media', 'Graph', 'Picture', 'Camera']
                visible_row_count: 5
            - roller:
                id: size_roller
                align: CENTER
                x: 160
                y: 16
                width: 280
                options: ["Small", "Wide", "Tall", "Big"]
                visible_row_count: 5
            - button:
                align: BOTTOM_LEFT
                x: 18
                y: -18
                width: 200
                height: 62
                bg_color: accent
                widgets:
                  - label: { text: "Set", align: CENTER, text_color: bg_dark }
                on_click:
                  - lambda: |-
                      int i = id(active_tile);
                      id(tile_types)[i] = (int8_t) id(type_roller)->get_selected_index();
                      id(tile_sizes)[i] = (int8_t) (id(size_roller)->get_selected_index() + 1);
                  - lvgl.widget.hide: type_picker
                  - script.execute: render_tiles
                  - script.execute: layout_tiles
            - button:
                align: BOTTOM_MID
                y: -18
                width: 200
                height: 62
                widgets:
                  - label: { text: "Remove", align: CENTER }
                on_click:
                  - lambda: 'id(tile_sizes)[id(active_tile)] = 0;'
                  - lvgl.widget.hide: type_picker
                  - script.execute: layout_tiles
            - button:
                align: BOTTOM_RIGHT
                x: -18
                y: -18
                width: 200
                height: 62
                widgets:
                  - label: { text: "Cancel", align: CENTER }
                on_click:
                  - lvgl.widget.hide: type_picker

      # ---- On-screen keyboard to type a tile's entity_id -------------------
      - obj:
          id: entity_editor
          hidden: true
          align: CENTER
          width: 1180
          height: 720
          bg_color: card_bg
          bg_opa: COVER
          radius: 12
          border_width: 0
          widgets:
            - label: { text: "Entity ID", styles: card_title, align: TOP_LEFT, x: 24, y: 18 }
            - textarea:
                id: entity_input
                align: TOP_MID
                y: 48
                width: 92%
                height: 58
                one_line: true
                max_length: 64
                placeholder_text: "sensor.living_room_temperature"
            - button:
                align: TOP_LEFT
                x: 24
                y: 118
                width: 190
                height: 54
                widgets:
                  - label: { text: "Cancel", align: CENTER }
                on_click:
                  - lvgl.widget.hide: entity_editor
            - button:
                align: TOP_RIGHT
                x: -24
                y: 118
                width: 190
                height: 54
                bg_color: accent
                widgets:
                  - label: { text: "Save", align: CENTER, text_color: bg_dark }
                on_click:
                  - script.execute: save_entity
                  - lvgl.widget.hide: entity_editor
                  - lvgl.widget.hide: type_picker
            - keyboard:
                id: kb
                textarea: entity_input
                align: BOTTOM_MID
                width: 100%
                height: 430

