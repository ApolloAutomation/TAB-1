# ============================================================================
#  Display.yaml — GENERATED. DSI panel, GT911 touch, and the tile dashboard.
#  Behaviour lives in tiles.h (included from TAB-1.yaml).
#
#   - Main page: up to 12 configurable tiles in a 4x3 cell grid.
#   - Long-press a tile to edit its TYPE and SIZE, or Remove it.
#   - Each tile binds to a Home Assistant entity via its "Tile N entity" text
#     box (editable in HA, saved to flash). Bind takes effect on restart.
#   - Swipe LEFT for Settings (brightness, demo mode, add tile).
# ============================================================================

color:
  - id: bg_dark
    hex: "0F1420"
  - id: card_bg
    hex: "1B2233"
  - id: accent
    hex: "3FA7F3"
  - id: on_color
    hex: "F4A900"
  - id: text_primary
    hex: "F2F4F8"
  - id: text_muted
    hex: "8A93A6"

i2c_device:
  - id: display_i2c
    address: 0x45
    i2c_id: i2c_bus_a

touchscreen:
  - platform: gt911
    id: touchscreen_id
    i2c_id: i2c_bus_a
    update_interval: 50ms
    # If touch is mirrored/swapped: transform: { swap_xy: true, mirror_x: true }

display:
  - platform: mipi_dsi
    id: dsi_display
    model: WAVESHARE-P4-NANO-10.1
    auto_clear_enabled: false
    update_interval: never

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - then:
          - lvgl.label.update: { id: lbl_time, text: { time_format: "%H:%M", time: ha_time } }
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - lvgl.label.update: { id: lbl_time, text: { time_format: "%H:%M", time: ha_time } }

binary_sensor:
  - platform: status
    id: sys_status
    on_state:
      - lvgl.label.update:
          id: lbl_ha_status
          text: !lambda 'return std::string(x ? "Connected" : "Offline");'

