# ============================================================================
#  Engine.yaml — the dashboard engine package
#  Pulled in as a package by TAB-1-engine.yaml and TAB-1-engine-bench.yaml.
#
#  The tablet shows dashboards made in the Apollo TAB Dashboard integration in
#  Home Assistant. Home Assistant sends each dashboard at runtime, so a new or
#  changed dashboard needs no reflash. The contract between the two sides is
#  engine_tests/contract/CONTRACT.md.
#
#     engine/          the engine itself: plain C++ and LVGL, header files only
#     engine_glue.h    the ESPHome side: memory, flash, API key, events
#     this file        fonts, the eight Home Assistant actions, the two events,
#                      the LVGL setup and the start-up script
#
#  docs/engine.md explains how to flash it and how to switch back.
# ============================================================================

esphome:
  # Exactly these two. `includes:` copies every file of a folder into the
  # build, so tests and tools live in engine_tests/, which is never included.
  includes:
    - engine
    - engine_glue.h

# --- Actions Home Assistant calls (contract section 2.1) ---------------------
# Every chain is synchronous: no delay, wait_until or script.wait. Then each
# string argument is a view into ESPHome's receive buffer instead of a copy.
# tools/check_engine_package.py checks names, arguments and response modes
# against contract.json.
api:
  actions:
    - action: tab_hello
      variables:
        nonce: string
        auth: string
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              tab_glue::hello(nonce, auth, root);

    - action: tab_status
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              tab_glue::status(root);

    - action: tab_pair
      variables:
        nonce: string
        wrapped: string
        kid: string
      supports_response: status
      then:
        - lambda: |-
            tab_glue::pair(nonce, wrapped, kid);
        - api.respond:
            success: !lambda return tab_glue::ok();
            error_message: !lambda return tab_glue::error();

    - action: tab_layout
      variables:
        hash: string
        seq: int
        total: int
        size: int
        data: string
      supports_response: status
      then:
        - lambda: |-
            tab_glue::layout(hash, seq, total, size, data);
        - api.respond:
            success: !lambda return tab_glue::ok();
            error_message: !lambda return tab_glue::error();

    - action: tab_commit
      variables:
        hash: string
        auth: string
      supports_response: status
      then:
        - lambda: |-
            tab_glue::commit(hash, auth);
        - api.respond:
            success: !lambda return tab_glue::ok();
            error_message: !lambda return tab_glue::error();

    - action: tab_set
      variables:
        data: string
        auth: string
      supports_response: status
      then:
        - lambda: |-
            tab_glue::set(data, auth);
        - api.respond:
            success: !lambda return tab_glue::ok();
            error_message: !lambda return tab_glue::error();

    - action: tab_ack
      variables:
        n: int
        ok: bool
        code: string
        auth: string
      supports_response: none
      then:
        - lambda: |-
            tab_glue::ack(n, ok, code, auth);

    - action: tab_clear
      variables:
        auth: string
      supports_response: status
      then:
        - lambda: |-
            tab_glue::clear(auth);
        - api.respond:
            success: !lambda return tab_glue::ok();
            error_message: !lambda return tab_glue::error();

