script:
  # Events the tablet fires (contract section 2.2). `data:` and never
  # `data_template:`: Home Assistant would run a template through Jinja.
  - id: tab_send_hello
    mode: parallel
    parameters:
      d: string
    then:
      - homeassistant.event:
          event: esphome.tab1_hello
          data:
            d: !lambda return d;

  - id: tab_send_input
    mode: parallel
    parameters:
      d: string
      s: string
    then:
      - homeassistant.event:
          event: esphome.tab1_input
          data:
            d: !lambda return d;
            s: !lambda return s;

  # Hands the fonts and the event sender to the engine and starts it. The entry
  # file runs this from on_boot, after fast_display::setup.
  #
  # ESPHome builds `includes:` from the ESPHome config folder when it finds
  # them there, before this package's folder. This file always comes from the
  # package, so it stops a build that picked up an old or foreign copy of
  # engine/, engine_glue.h or ota_lock.h (docs/engine.md, "Old copies of the
  # package's files"), also a copy from before these numbers, which has none.
  # Raise the 3 below with the numbers in those files.
  - id: tab_engine_start
    then:
      - lambda: |-
          #if !defined(TAB1_FILES_ENGINE) || TAB1_FILES_ENGINE != 10
          #error "engine/ is not this package's copy: delete the old engine/ folder from your ESPHome config folder (docs/engine.md, Old copies of the package's files)"
          #endif
          #if !defined(TAB1_FILES_GLUE) || TAB1_FILES_GLUE != 10
          #error "engine_glue.h is not this package's copy: delete the old engine_glue.h from your ESPHome config folder (docs/engine.md, Old copies of the package's files)"
          #endif
          #if !defined(TAB1_FILES_LOCK) || TAB1_FILES_LOCK != 10
          #error "ota_lock.h is not this package's copy: delete the old ota_lock.h from your ESPHome config folder (docs/engine.md, Old copies of the package's files)"
          #endif
          static tab::Fonts fonts;
          fonts.text[0] = id(tab_text_14)->get_lv_font();
          fonts.text[1] = id(tab_text_15)->get_lv_font();
          fonts.text[2] = id(tab_text_16)->get_lv_font();
          fonts.text[3] = id(tab_text_18)->get_lv_font();
          fonts.text[4] = id(tab_text_20)->get_lv_font();
          fonts.text[5] = id(tab_text_28)->get_lv_font();
          fonts.text[6] = id(tab_text_34)->get_lv_font();
          fonts.digits[0] = id(tab_digits_48)->get_lv_font();
          fonts.digits[1] = id(tab_digits_96)->get_lv_font();
          fonts.digits[2] = id(tab_digits_192)->get_lv_font();
          fonts.icon[0] = id(tab_icon_24)->get_lv_font();
          fonts.icon[1] = id(tab_icon_28)->get_lv_font();
          fonts.icon[2] = id(tab_icon_48)->get_lv_font();
          fonts.icon[3] = id(tab_icon_72)->get_lv_font();
          tab_glue::start(fonts, [](const char *name, const char *d, const char *s) {
            if (strcmp(name, "tab1_input") == 0) {
              id(tab_send_input).execute(std::string(d), std::string(s != nullptr ? s : ""));
            } else if (strcmp(name, "tab1_hello") == 0) {
              id(tab_send_hello).execute(std::string(d));
            } else {
              ESP_LOGW("tab", "Unknown event %s", name);
            }
          });

lvgl:
  displays:
    - dsi_display
  touchscreens:
    - touchscreen_id: touchscreen_id
      long_press_time: 900ms
  # Which way up: `screen_rotation` in the entry file, "90" or "270" (the same
  # picture, half a turn apart). ESPHome turns the picture in software and
  # each touch point with it, so the engine only ever sees 1280x800.
  rotation: ${screen_rotation}
  buffer_size: 12%   # 1/8 screen in internal SRAM; fast_display.h relies on it
  default_font: tab_text_16
  bg_color: 0x000000

  # ESPHome only compiles in the LVGL widget types that appear in YAML. The
  # engine creates its widgets in C++ from plain objects and labels, and draws
  # arcs, lines and bars itself with LVGL's draw functions, so this hidden
  # container names exactly those two types. If the engine ever creates
  # another LVGL widget type, add it here. Nothing here is shown.
  widgets:
    - obj:
        id: tab_enable
        hidden: true
        x: 0
        y: 0
        width: 4
        height: 4
        widgets:
          - label: { text: " ", text_font: tab_text_16 }
