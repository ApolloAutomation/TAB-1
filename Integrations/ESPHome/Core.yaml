# ============================================================================
#  Core.yaml — board + system for the Waveshare ESP32-P4-NANO
#  Pulled in as a package by TAB-1.yaml. 100% mainline ESPHome (2025.11+).
#
#  WiFi on the ESP32-P4 has no radio of its own — it talks to the on-board
#  ESP32-C6 co-processor over SDIO (the `esp32_hosted` block below).
# ============================================================================

esp32:
  variant: ESP32P4
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    # No pinned version — use ESPHome's recommended IDF for this release.
    advanced:
      enable_idf_experimental_features: true
    sdkconfig_options:
      # A roomier main-task stack keeps LVGL happy. Everything else the
      # display/psram/wifi need is injected automatically by their components.
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
      CONFIG_FREERTOS_HZ: "1000"

# 32 MB PSRAM (octal / "hex" mode). Required — the DSI framebuffer lives here.
psram:
  mode: hex
  speed: 200MHz

# Internal LDO that powers the MIPI-DSI PHY (channel 3 → 2.5 V).
esp_ldo:
  - channel: 3
    id: dsi_phy_ldo
    adjustable: false
    voltage: 2.5V

# WiFi co-processor: on-board ESP32-C6 reached over 4-bit SDIO.
esp32_hosted:
  variant: ESP32C6
  active_high: true
  reset_pin: GPIO54
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

# Shared I²C bus: GT911 touch panel + display power/backlight chip (0x45).
i2c:
  - id: i2c_bus_a
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz
    scan: false

# ---------------------------------------------------------------------------
#  Handy diagnostics, exposed to Home Assistant (optional — trim if you like).
# ---------------------------------------------------------------------------
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s
  - platform: internal_temperature
    name: "CPU Temperature"
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"

button:
  - platform: restart
    name: "Restart"
