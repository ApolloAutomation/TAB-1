# ============================================================================
#  Board: Guition JC8012P4A1 — ESP32-P4 + C6, 10.1" 800×1280 DSI (JD9365)
#  Selected in TAB-1.yaml under `packages: board:`. Everything here is
#  mainline ESPHome (2026.10+).
#
#  I²C (i2c_bus_a, GPIO7/8) on this board: ES8311 codec @0x18, GSL3670 touch
#  @0x40 (plus 0x32/0x36). Backlight is PWM on GPIO23 — no power chip.
#
#  Every board file must provide: `dsi_display`, `touchscreen_id`, and the
#  `set_backlight(percent)` script used by the Settings brightness slider.
# ============================================================================

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO23

light:
  - platform: monochromatic
    id: backlight
    name: "Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

touchscreen:
  - platform: gsl3670
    id: touchscreen_id
    i2c_id: i2c_bus_a
    # Model sets reset GPIO22, interrupt GPIO21, axis transform and firmware.
    # The default firmware (132 pages) is byte-identical to the GSL table in
    # Guition's factory image. Don't swap in the 139-page table from their newer
    # demo source: its extra 0xE0–0xE6 tuning pages made touch feel slower.
    # Reg 0xb0 reads 00000000 on this chip even under Guition's own firmware, so
    # it's no "touch alive" check — if touch is dead but I²C works, reseat the
    # touch ribbon first.
    model: GUITION-JC8012P4A1

display:
  - platform: mipi_dsi
    id: dsi_display
    # Two panel revisions ship under this name. Our unit needs V2 — the original
    # JC8012P4A1 model shows only lines with the backlight on. If a unit shows
    # lines with V2, try plain JC8012P4A1.
    model: JC8012P4A1-V2
    # Match Guition's own "New_Panel" demo (guitionofficial/P4-series): its init
    # table is identical to ESPHome's V2, but it runs the link at 840 Mbps (not
    # 1500) and uses vsync front porch 30 (not 20). Lane rate must be
    # 20 MHz × an even number or ESP-IDF's PLL setup asserts.
    lane_bit_rate: 840Mbps
    vsync_front_porch: 30
    auto_clear_enabled: false
    update_interval: never

script:
  - id: set_backlight
    parameters:
      percent: float
    then:
      - light.turn_on:
          id: backlight
          brightness: !lambda 'return std::max(percent, 5.0f) / 100.0f;'
          # Track the slider directly; the 250 ms default fade would restart on
          # every slider step and lag behind the finger.
          transition_length: 0s
