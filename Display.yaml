# ============================================================================
#  Display.yaml — DSI panel, GT911 touch, and a CONFIGURABLE tile dashboard.
#  Pulled in as a package by TAB-1.yaml.
#
#  HOW IT WORKS
#   - The main page is a 4x3 grid of 12 configurable tiles.
#   - Each tile's Home Assistant entity is set from a text box (they appear in
#     HA as "Tile N entity"). Type the entity_id, then RESTART the device and
#     it subscribes to that entity. (Re-bind needs a restart by design.)
#   - Long-press any tile to change its TYPE (Value / Switch / Dimmer / Button /
#     Scene / Cover / Climate) via an on-screen picker. Type changes are live.
#   - Swipe LEFT for the Settings page (screen brightness).
#
#  Tile behaviour lives in tiles.h (included from TAB-1.yaml).
# ============================================================================

color:
  - id: bg_dark
    hex: "0F1420"
  - id: card_bg
    hex: "1B2233"
  - id: accent
    hex: "3FA7F3"
  - id: on_color
    hex: "F4A900"
  - id: text_primary
    hex: "F2F4F8"
  - id: text_muted
    hex: "8A93A6"

# --- Display power/backlight chip on the shared I2C bus (address 0x45) -------
i2c_device:
  - id: display_i2c
    address: 0x45
    i2c_id: i2c_bus_a

# --- Capacitive touch panel -------------------------------------------------
touchscreen:
  - platform: gt911
    id: touchscreen_id
    i2c_id: i2c_bus_a
    update_interval: 50ms
    # If touch is mirrored/swapped on your unit, add e.g.:
    #   transform: { swap_xy: true, mirror_x: true, mirror_y: false }

# --- 10.1" MIPI-DSI panel (rotation lives in the LVGL block) -----------------
display:
  - platform: mipi_dsi
    id: dsi_display
    model: WAVESHARE-P4-NANO-10.1
    auto_clear_enabled: false
    update_interval: never

# --- Clock (from Home Assistant) --------------------------------------------
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - then:
          - lvgl.label.update:
              id: lbl_time
              text: { time_format: "%H:%M", time: ha_time }
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - lvgl.label.update:
              id: lbl_time
              text: { time_format: "%H:%M", time: ha_time }

# --- Header HA-connection indicator -----------------------------------------
binary_sensor:
  - platform: status
    id: sys_status
    on_state:
      - lvgl.label.update:
          id: lbl_ha_status
          text: !lambda 'return std::string(x ? "Connected" : "Offline");'

# ============================================================================
#  Per-tile entity boxes (editable in Home Assistant, persisted across reboots)
#  >>> Type an entity_id into each, then RESTART the device. <<<
# ============================================================================
text:
  - platform: template
    id: t0_entity
    name: "Tile 1 entity"
    optimistic: true
    restore_value: true
    mode: text
    icon: "mdi:tag-outline"
    entity_category: config
    max_length: 64
