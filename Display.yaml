# ============================================================================
#  The dashboard
# ============================================================================
lvgl:
  displays:
    - dsi_display
  touchscreens:
    - touchscreen_id
  rotation: 270°
  default_font: montserrat_20
  bg_color: bg_dark

  theme:
    label:
      text_color: text_primary

  style_definitions:
    - id: card
      bg_color: card_bg
      bg_opa: COVER
      radius: 16
      border_width: 0
      pad_all: 18
      text_color: text_primary
    - id: card_title
      text_color: text_muted
      text_font: montserrat_20
    - id: tile_card
      bg_color: card_bg
      bg_opa: COVER
      radius: 16
      border_width: 0
      pad_all: 14
      text_color: text_primary
    - id: tile_name
      text_color: text_primary
      text_font: montserrat_20
    - id: tile_badge
      text_color: text_muted
      text_font: montserrat_16
    - id: tile_value
      text_color: accent
      text_font: montserrat_36

  # ---- Long-press tile editor: type + size (floats above everything) -------
  top_layer:
    widgets:
      - obj:
          id: type_picker
          hidden: true
          align: CENTER
          width: 680
          height: 560
          bg_color: card_bg
          bg_opa: COVER
          radius: 18
          border_width: 0
          widgets:
            - label: { text: "Edit tile", styles: card_title, align: TOP_MID, y: 16 }
            - label: { text: "Type", styles: card_title, align: TOP_LEFT, x: 78, y: 56 }
            - label: { text: "Size", styles: card_title, align: TOP_RIGHT, x: -86, y: 56 }
            - roller:
                id: type_roller
                align: CENTER
                x: -160
                y: -18
                width: 280
                options: ["Value", "Switch", "Dimmer", "Button", "Scene", "Cover", "Climate"]
                visible_row_count: 5
            - roller:
                id: size_roller
                align: CENTER
                x: 160
                y: -18
                width: 280
                options: ["Small", "Wide", "Tall", "Big"]
                visible_row_count: 5
            - button:
                align: BOTTOM_LEFT
                x: 18
                y: -18
                width: 200
                height: 62
                bg_color: accent
                widgets:
                  - label: { text: "Set", align: CENTER, text_color: bg_dark }
                on_click:
                  - lambda: |-
                      int i = id(active_tile);
                      id(tile_types)[i] = (int8_t) id(type_roller)->get_selected_index();
                      id(tile_sizes)[i] = (int8_t) (id(size_roller)->get_selected_index() + 1);
                  - lvgl.widget.hide: type_picker
                  - script.execute: render_tiles
                  - script.execute: layout_tiles
            - button:
                align: BOTTOM_MID
                y: -18
                width: 200
                height: 62
                widgets:
                  - label: { text: "Remove", align: CENTER }
                on_click:
                  - lambda: 'id(tile_sizes)[id(active_tile)] = 0;'
                  - lvgl.widget.hide: type_picker
                  - script.execute: layout_tiles
            - button:
                align: BOTTOM_RIGHT
                x: -18
                y: -18
                width: 200
                height: 62
                widgets:
                  - label: { text: "Cancel", align: CENTER }
                on_click:
                  - lvgl.widget.hide: type_picker

  pages:
    # ==================== Main: the tile grid =============================
    - id: main_page
      bg_color: bg_dark
      scrollbar_mode: "OFF"
      pad_all: 0
      on_swipe_left:
        - lvgl.page.show: { id: settings_page, animation: MOVE_LEFT, time: 250ms }
      widgets:
        # Header
        - obj:
            align: TOP_MID
            y: 0
            width: 1280
            height: 64
            bg_color: bg_dark
            bg_opa: COVER
            border_width: 0
            radius: 0
            pad_all: 0
            widgets:
              - label: { id: lbl_time, text: "--:--", text_font: montserrat_28, align: LEFT_MID, x: 24 }
              - label: { text: "Home", text_font: montserrat_28, align: CENTER }
              - label: { id: lbl_ha_status, text: "Offline", text_color: text_muted, align: RIGHT_MID, x: -24 }
        # Tile grid (tiles are positioned/sized at runtime by layout_tiles)
        - obj:
            align: TOP_MID
            y: 72
            width: 1232
            height: 700
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollbar_mode: "OFF"
            widgets:
              - obj:
                  id: tile0
                  width: 296
                  height: 216
                  styles: tile_card
                  clickable: true
                  checked:
                    border_width: 3
                    border_color: on_color
                  widgets:
                    - label: { id: tn0, text: "Tile 1", styles: tile_name, align: TOP_LEFT }
                    - label: { id: tt0, text: "Value", styles: tile_badge, align: TOP_RIGHT }
                    - label: { id: tv0, text: "--", styles: tile_value, align: CENTER, y: 6 }
                    - slider:
                        id: ts0
                        hidden: true
                        align: BOTTOM_MID
                        width: 100%
                        height: 18
                        radius: 9
                        indicator: { radius: 9 }
                        knob: { pad_all: 6, radius: 9 }
                        on_release:
                          - if:
                              condition: { lambda: 'return id(tile_types)[0] == tiles::TT_DIMMER;' }
                              then:
                                - homeassistant.action:
                                    action: light.turn_on
                                    data:
                                      entity_id: !lambda 'return id(t0_entity).state;'
                                      brightness_pct: !lambda 'return (int) x;'
                          - if:
                              condition: { lambda: 'return id(tile_types)[0] == tiles::TT_CLIMATE;' }
                              then:
                                - homeassistant.action:
                                    action: climate.set_temperature
                                    data:
                                      entity_id: !lambda 'return id(t0_entity).state;'
                                      temperature: !lambda 'return x;'
                  on_click:
                    - if:
                        condition:
                          lambda: 'return tiles::tap_fires(id(tile_types)[0]) && !id(t0_entity).state.empty();'
                        then:
                          - homeassistant.action:
                              action: !lambda 'return tiles::tap_service(id(tile_types)[0], id(t0_entity).state);'
                              data:
                                entity_id: !lambda 'return id(t0_entity).state;'
                  on_long_press:
                    - lambda: |-
                        id(active_tile) = 0;
                        id(type_roller)->set_selected_index(id(tile_types)[0], LV_ANIM_OFF);
                        int sc = id(tile_sizes)[0];
                        id(size_roller)->set_selected_index(sc < 1 ? 0 : sc - 1, LV_ANIM_OFF);
                    - lvgl.widget.show: type_picker
              - obj:
                  id: tile1
                  width: 296
                  height: 216
                  styles: tile_card
                  clickable: true
                  checked:
                    border_width: 3
                    border_color: on_color
                  widgets:
                    - label: { id: tn1, text: "Tile 2", styles: tile_name, align: TOP_LEFT }
                    - label: { id: tt1, text: "Value", styles: tile_badge, align: TOP_RIGHT }
                    - label: { id: tv1, text: "--", styles: tile_value, align: CENTER, y: 6 }
                    - slider:
                        id: ts1
                        hidden: true
                        align: BOTTOM_MID
                        width: 100%
                        height: 18
                        radius: 9
                        indicator: { radius: 9 }
                        knob: { pad_all: 6, radius: 9 }
                        on_release:
                          - if:
                              condition: { lambda: 'return id(tile_types)[1] == tiles::TT_DIMMER;' }
                              then:
                                - homeassistant.action:
                                    action: light.turn_on
                                    data:
                                      entity_id: !lambda 'return id(t1_entity).state;'
                                      brightness_pct: !lambda 'return (int) x;'
                          - if:
                              condition: { lambda: 'return id(tile_types)[1] == tiles::TT_CLIMATE;' }
                              then:
                                - homeassistant.action:
                                    action: climate.set_temperature
                                    data:
