                std::function<void(const std::string &)>([](const std::string &s) {
              lv_label_set_text(id(tv7), tiles::format_state(id(tile_types)[7], s).c_str());
              if (tiles::state_is_active(s)) lv_obj_add_state(id(tile7), LV_STATE_CHECKED);
              else lv_obj_clear_state(id(tile7), LV_STATE_CHECKED);
            }));
          }
      - lambda: |-
          std::string e8 = id(t8_entity).state;
          if (!e8.empty()) {
            api::global_api_server->subscribe_home_assistant_state(
